"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 800

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"

[python]
# shows Python version + active venv when inside a project
detect_extensions = ["py"]

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[hostname]
ssh_only = true
